services:
  # Database Layer: PostgreSQL
  postgres:
    image: postgres:16-alpine
    container_name: ayurdiet-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-ayurdiet_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-ayurdiet_password}
      POSTGRES_DB: ${DB_NAME:-ayurdiet_db}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-ayurdiet_user} -d ${DB_NAME:-ayurdiet_db}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Vector Database: Qdrant (Future Knowledge Base Layer)
  qdrant:
    image: qdrant/qdrant:latest
    container_name: ayurdiet-qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage

  # Application Backend: Node.js / Express
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ayurdiet-backend
    restart: unless-stopped
    ports:
      - "${PORT:-5000}:5000"
    environment:
      NODE_ENV: development
      PORT: 5000
      DATABASE_URL: postgresql://${DB_USER:-ayurdiet_user}:${DB_PASSWORD:-ayurdiet_password}@postgres:5432/${DB_NAME:-ayurdiet_db}
      AI_SERVICE_URL: http://ai-service:8000
    depends_on:
      postgres:
        condition: service_healthy

  # AI Service: Python / FastAPI
  ai-service:
    build:
      context: ./ai-service
      dockerfile: Dockerfile
    container_name: ayurdiet-ai-service
    restart: unless-stopped
    ports:
      - "${AI_SERVICE_PORT:-8000}:8000"
    environment:
      AI_SERVICE_PORT: 8000
      BACKEND_URL: http://backend:5000
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      QDRANT_URL: http://qdrant:6333
    depends_on:
      - qdrant

  # Frontend: React.js / Vite
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: ayurdiet-frontend
    restart: unless-stopped
    ports:
      - "5173:5173"
    environment:
      VITE_API_URL: http://localhost:5000
    depends_on:
      - backend

volumes:
  postgres_data:
  qdrant_data:
